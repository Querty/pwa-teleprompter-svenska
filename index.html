<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Svenska Teleprompter (Google AI)</title>

    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- Clean manifest link for PWA -->
    <link rel="manifest" href="manifest.json" />

    <style>
      :root {
        --bg: #000000;
        --dim-text: rgba(255, 255, 255, 0.28);
        --passed-text: rgba(255, 255, 255, 0.55);
        --active-text: #ffffff;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--active-text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
      }

      /* Input View */
      #inputView {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        padding: 24px;
        max-width: 800px;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 16px 0;
        font-weight: 600;
      }
      textarea {
        flex: 1;
        width: 100%;
        background: #121212;
        border: 1px solid #27272a;
        border-radius: 12px;
        color: #fff;
        padding: 16px;
        font-size: 1.05rem;
        resize: none;
        outline: none;
        line-height: 1.6;
      }
      textarea:focus {
        border-color: #52525b;
      }

      .toolbar {
        display: flex;
        gap: 10px;
        margin-top: 14px;
        align-items: center;
        flex-wrap: wrap;
      }

      input[type="password"],
      select {
        background: #18181b;
        border: 1px solid #27272a;
        color: #fff;
        padding: 11px 14px;
        border-radius: 10px;
        font-size: 0.9rem;
        outline: none;
      }
      input[type="password"]:focus,
      select:focus {
        border-color: #52525b;
      }

      button {
        background: #27272a;
        border: none;
        color: #fff;
        padding: 12px 20px;
        border-radius: 10px;
        font-size: 0.95rem;
        font-weight: 500;
        cursor: pointer;
      }
      button.primary {
        background: #ffffff;
        color: #000;
        font-weight: 600;
      }
      button.primary:active {
        background: #d4d4d8;
      }

      /* Prompter View */
      #prompterView {
        display: none;
        width: 100%;
        height: 100%;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
      }
      #textStage {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 24px;
        overflow-y: auto;
        text-align: left;
      }
      #paragraphContainer {
        max-width: 840px;
        font-size: 1.85rem;
        line-height: 1.7;
        font-weight: 600;
      }
      @media (max-width: 600px) {
        #paragraphContainer {
          font-size: 1.45rem;
        }
      }

      /* Spotify Lyrics Effect */
      .sentence {
        color: var(--dim-text);
        cursor: pointer;
        display: inline;
        transition:
          color 0.3s ease,
          text-shadow 0.3s ease;
        margin-right: 0.25em;
      }
      .sentence.passed {
        color: var(--passed-text);
      }
      .sentence.active {
        color: var(--active-text);
        text-shadow:
          0 0 16px rgba(255, 255, 255, 0.75),
          0 0 32px rgba(255, 255, 255, 0.35);
      }

      /* Dock */
      .dock {
        padding: 16px 24px;
        background: rgba(10, 10, 10, 0.85);
        backdrop-filter: blur(12px);
        border-top: 1px solid #18181b;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .dock-group {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .icon-btn {
        padding: 10px 14px;
        border-radius: 8px;
      }
      #progressIndicator {
        font-size: 0.85rem;
        color: #71717a;
        margin-right: 12px;
      }
    </style>
  </head>
  <body>
    <!-- Input Mode -->
    <div id="inputView">
      <h1>Svenska Teleprompter</h1>
      <textarea
        id="textInput"
        placeholder="Klistra in eller skriv din svenska text här..."
      ></textarea>
      <div class="toolbar">
        <input type="password" id="apiKeyInput" placeholder="Google API Key" />
        <select id="voiceSelect">
          <option value="sv-SE-Wavenet-A">Wavenet A (Kvinna)</option>
          <option value="sv-SE-Wavenet-D">Wavenet D (Man)</option>
          <option value="sv-SE-Neural2-A">Neural2 A (Kvinna)</option>
        </select>
        <button class="primary" id="startBtn">Starta Läsning</button>
        <button id="demoBtn">Exempel</button>
        <button id="clearBtn">Rensa</button>
      </div>
    </div>

    <!-- Prompter Mode -->
    <div id="prompterView">
      <div id="textStage">
        <div id="paragraphContainer"></div>
      </div>
      <div class="dock">
        <button class="icon-btn" id="exitBtn">✕ Avsluta</button>
        <div class="dock-group">
          <span id="progressIndicator">Stycke 1/1</span>
          <button class="icon-btn" id="prevBtn">◀</button>
          <button class="icon-btn primary" id="playPauseBtn">Pausa</button>
          <button class="icon-btn" id="nextBtn">▶</button>
        </div>
      </div>
    </div>

    <script>
      // PWA Service Worker Registration
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      }

      // State
      let paragraphs = [];
      let pIndex = 0,
        sIndex = 0;
      let isPlaying = false;

      // Audio & Pre-buffer State
      const audioPlayer = new Audio();
      let preloadedAudio = null; // Holds base64 string of the next sentence
      let preloadedTarget = { p: -1, s: -1 }; // Tracks which sentence the preload belongs to

      // DOM Elements
      const inputView = document.getElementById("inputView");
      const prompterView = document.getElementById("prompterView");
      const textInput = document.getElementById("textInput");
      const apiKeyInput = document.getElementById("apiKeyInput");
      const voiceSelect = document.getElementById("voiceSelect");
      const paragraphContainer = document.getElementById("paragraphContainer");
      const playPauseBtn = document.getElementById("playPauseBtn");

      // API Key LocalStorage Management
      if (localStorage.getItem("gcloud_tts_key")) {
        apiKeyInput.value = localStorage.getItem("gcloud_tts_key");
      }
      apiKeyInput.addEventListener("input", () => {
        localStorage.setItem("gcloud_tts_key", apiKeyInput.value.trim());
      });

      // Chunk logic for text layout
      function splitSentences(paragraph) {
        const regex = /[^.!?]+[.!?]+|\s*$/g;
        const rawSentences = paragraph.match(regex) || [paragraph];
        return rawSentences.map((s) => s.trim()).filter((s) => s.length > 0);
      }

      function renderCurrentParagraph() {
        paragraphContainer.innerHTML = "";
        const sentences = paragraphs[pIndex] || [];
        sentences.forEach((text, i) => {
          const span = document.createElement("span");
          span.className = "sentence";
          span.id = `s-${i}`;
          span.textContent = text + " ";
          span.addEventListener("click", () => jumpToSentence(i));
          paragraphContainer.appendChild(span);
        });
        document.getElementById("progressIndicator").textContent =
          `Stycke ${pIndex + 1}/${paragraphs.length}`;
        updateHighlighting();
      }

      function updateHighlighting() {
        const spans = paragraphContainer.querySelectorAll(".sentence");
        spans.forEach((span, i) => {
          span.classList.remove("active", "passed");
          if (i === sIndex) span.classList.add("active");
          else if (i < sIndex) span.classList.add("passed");
        });
      }

      // Fetch Audio from Google Cloud TTS
      async function fetchGoogleAudio(text, key, voice) {
        try {
          const response = await fetch(
            `https://texttospeech.googleapis.com/v1/text:synthesize?key=${key}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                input: { text: text },
                voice: { languageCode: "sv-SE", name: voice },
                audioConfig: { audioEncoding: "MP3" },
              }),
            },
          );

          if (!response.ok) {
            console.error("API Error", await response.text());
            return null;
          }

          const data = await response.json();
          return `data:audio/mp3;base64,${data.audioContent}`;
        } catch (err) {
          console.error("Network Error", err);
          return null;
        }
      }

      // Pre-buffer the upcoming sentence while the current one is playing
      async function preloadNextSentence(key, voice) {
        let nextP = pIndex;
        let nextS = sIndex + 1;

        if (nextS >= paragraphs[nextP].length) {
          nextP++;
          nextS = 0;
        }

        if (nextP < paragraphs.length) {
          const nextText = paragraphs[nextP][nextS];
          const src = await fetchGoogleAudio(nextText, key, voice);
          if (src) {
            preloadedAudio = src;
            preloadedTarget = { p: nextP, s: nextS };
          }
        }
      }

      // Main Playback Logic
      async function speakCurrentSentence() {
        audioPlayer.pause();
        if (!isPlaying) return;

        const currentPara = paragraphs[pIndex];
        if (!currentPara || sIndex >= currentPara.length) {
          if (pIndex + 1 < paragraphs.length) {
            pIndex++;
            sIndex = 0;
            renderCurrentParagraph();
            speakCurrentSentence();
          } else {
            isPlaying = false;
            playPauseBtn.textContent = "Spela igen";
          }
          return;
        }

        updateHighlighting();
        const text = currentPara[sIndex];
        const key = apiKeyInput.value.trim();
        const voice = voiceSelect.value;

        if (!key) {
          alert("Var god ange din Google API-nyckel.");
          isPlaying = false;
          playPauseBtn.textContent = "Fortsätt";
          return;
        }

        // Check if we already buffered this exact sentence
        if (
          preloadedAudio &&
          preloadedTarget.p === pIndex &&
          preloadedTarget.s === sIndex
        ) {
          audioPlayer.src = preloadedAudio;
          preloadedAudio = null; // consume buffer
        } else {
          // Not buffered (happens on first start or if user skips around)
          const src = await fetchGoogleAudio(text, key, voice);
          if (src) audioPlayer.src = src;
          else {
            sIndex++; // skip if API failed
            speakCurrentSentence();
            return;
          }
        }

        // Play audio and trigger the next buffer immediately
        try {
          await audioPlayer.play();
          preloadNextSentence(key, voice);
        } catch (err) {
          console.error("Playback error:", err);
        }

        audioPlayer.onended = () => {
          if (!isPlaying) return;
          sIndex++;
          speakCurrentSentence();
        };
      }

      function jumpToSentence(index) {
        sIndex = index;
        isPlaying = true;
        playPauseBtn.textContent = "Pausa";
        speakCurrentSentence();
      }

      // Controls
      document.getElementById("startBtn").addEventListener("click", () => {
        const text = textInput.value.trim();
        if (!text) return;

        paragraphs = text
          .split(/\n+/)
          .filter((p) => p.trim())
          .map((p) => splitSentences(p))
          .filter((p) => p.length > 0);
        if (paragraphs.length === 0) return;

        pIndex = 0;
        sIndex = 0;
        preloadedAudio = null; // Reset buffer
        inputView.style.display = "none";
        prompterView.style.display = "flex";
        isPlaying = true;
        playPauseBtn.textContent = "Pausa";

        renderCurrentParagraph();
        speakCurrentSentence();
      });

      playPauseBtn.addEventListener("click", () => {
        if (isPlaying) {
          isPlaying = false;
          audioPlayer.pause();
          playPauseBtn.textContent = "Fortsätt";
        } else {
          isPlaying = true;
          playPauseBtn.textContent = "Pausa";
          if (
            audioPlayer.src &&
            audioPlayer.currentTime > 0 &&
            !audioPlayer.ended
          ) {
            audioPlayer.play();
          } else {
            speakCurrentSentence();
          }
        }
      });

      document.getElementById("nextBtn").addEventListener("click", () => {
        if (sIndex + 1 < paragraphs[pIndex].length) {
          sIndex++;
        } else if (pIndex + 1 < paragraphs.length) {
          pIndex++;
          sIndex = 0;
          renderCurrentParagraph();
        }
        speakCurrentSentence();
      });

      document.getElementById("prevBtn").addEventListener("click", () => {
        if (sIndex > 0) {
          sIndex--;
        } else if (pIndex > 0) {
          pIndex--;
          sIndex = paragraphs[pIndex].length - 1;
          renderCurrentParagraph();
        }
        speakCurrentSentence();
      });

      document.getElementById("exitBtn").addEventListener("click", () => {
        isPlaying = false;
        audioPlayer.pause();
        audioPlayer.src = "";
        prompterView.style.display = "none";
        inputView.style.display = "flex";
      });

      document.getElementById("clearBtn").addEventListener("click", () => {
        textInput.value = "";
        textInput.focus();
      });

      document.getElementById("demoBtn").addEventListener("click", () => {
        textInput.value = `Välkommen till telepromptern med Google Cloud.\nDenna röst låter mycket mer naturlig än den inbyggda.\n\nEftersom den förladdar nästa mening i bakgrunden, blir det inga hack i uppläsningen mellan raderna. Du kan testa att trycka på en mening för att hoppa dit direkt.`;
      });
    </script>
  </body>
</html>
